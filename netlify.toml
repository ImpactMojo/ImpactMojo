[build]
  # Stamp version.json (in-page auto-refresh) AND the service-worker cache
  # VERSION (rotates the runtime cache so returning visitors get fresh assets)
  # on every deploy. See scripts/stamp-version.sh.
  command = "bash scripts/stamp-version.sh"
  publish = "."
  functions = "netlify/functions"

# Pin the build + Functions runtime to Node 22 (Active LTS). Node 20 reached
# end-of-life in 2026; 22 keeps Functions on a supported, security-patched runtime.
[build.environment]
  NODE_VERSION = "22"

# Podcast unpublished (2026-07): the page was placeholder-only. Redirect to the roadmap.
# Data Dives were renamed Data Notes in v10.258.0. These keep every existing
# link, bookmark and indexed search result working against the new path.
[[redirects]]
  from = "/DataDives/*"
  to = "/DataNotes/:splat"
  status = 301

[[redirects]]
  from = "/DataDives"
  to = "/DataNotes/"
  status = 301

[[redirects]]
  from = "/podcast.html"
  to = "/updates.html"
  status = 301
  force = true
[[redirects]]
  from = "/podcast"
  to = "/updates.html"
  status = 301
  force = true

# One sampling Studio. Sampling Basics was folded into the Sampling Design
# Studio as its opening "Start here" section on 2026-10-12, and the Sampling
# Toolkit page, which only linked the two, was retired with it. The primer's
# old address opens that section (#basics); the toolkit's opens the Studio.
[[redirects]]
  from = "/Labs/sampling-basics-lab.html"
  to = "/labs/sampling-design-lab.html#basics"
  status = 301
  force = true

[[redirects]]
  from = "/Labs/sampling-toolkit.html"
  to = "/labs/sampling-design-lab.html"
  status = 301
  force = true

# HTML pages — short edge cache so TTFB drops from ~1.4s to <100ms on
# repeat hits. must-revalidate + Netlify's auto-cache-purge on deploy
# means visitors still see fresh content within seconds of a push.
# Security headers — site serves auth flows (login/account/Supabase tokens).
# HSTS is safe (site is HTTPS-only behind Netlify); Permissions-Policy keeps
# microphone for VaniScribe (self) and disables sensors no page uses.
# frame-ancestors is scoped to the auth/account/admin surface below so
# educators can still embed games/decks in an LMS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/login.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/signup.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/forgot-password.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/account.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/org-dashboard.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Long cache for static assets — images, logos, favicons rarely change.
# 7-day browser cache + a day of serve-stale-while-refreshing. Not
# `immutable` because filenames aren't content-hashed; ETag revalidation
# keeps a redesigned asset from sticking for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSS/JS — still revalidated after 5 min, but stale-while-revalidate lets
# the browser render instantly from cache and refresh in the background,
# so repeat visits never block on the network. The service worker's
# deploy-versioned cache handles SW clients; this covers everyone else.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/Games/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# 101 courses — clean URLs without .html extension
[[redirects]]
  from = "/101-courses/:slug"
  to = "/101-courses/:slug.html"
  status = 200
  force = false

# Cache 101 course HTML files (5 min)
[[headers]]
  for = "/101-courses/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Documentation — self-hosted Docsify (SPA fallback)
[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/docs/*"
  to = "/docs/index.html"
  status = 200
  force = false

# Internal ops notes (money-flow runbook etc.) — never served on the web
[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true

# ToR Builder moved out of BookCompanionTools to /tools/
[[redirects]]
  from = "/BookCompanionTools/tor-generator.html"
  to = "/premium-tools/tor-builder.html"
  status = 301
  force = true

# Sample Size Calculator consolidated into the Sampling Design Studio, which is
# a superset (guided design, strategy, cluster optimiser, defensible plan).
[[redirects]]
  from = "/BookCompanionTools/sample-size-calculator.html"
  to = "/Labs/sampling-design-lab.html"
  status = 301
  force = true

# /tools/ interim path -> final premium-tools home
[[redirects]]
  from = "/tools/tor-builder.html"
  to = "/premium-tools/tor-builder.html"
  status = 301
  force = true

# ToC Workbench consolidated into the Labs gallery — Labs/toc-lab.html is the
# canonical Theory of Change builder; the old standalone copy redirects there.
# (The /101-courses/toc-workbench course deck is separate and unaffected.)
[[redirects]]
  from = "/toc-workbench.html"
  to = "/Labs/toc-lab"
  status = 301
  force = true

[[redirects]]
  from = "/toc-workbench"
  to = "/Labs/toc-lab"
  status = 301
  force = true
