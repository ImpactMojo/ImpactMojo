# HTML pages — short edge cache so TTFB drops from ~1.4s to <100ms on
# repeat hits. must-revalidate + Netlify's auto-cache-purge on deploy
# means visitors still see fresh content within seconds of a push.
# Security headers — site serves auth flows (login/account/Supabase tokens).
# HSTS is safe (site is HTTPS-only behind Netlify); Permissions-Policy keeps
# microphone for VaniScribe (self) and disables sensors no page uses.
# frame-ancestors is scoped to the auth/account/admin surface below so
# educators can still embed games/decks in an LMS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Content-Security-Policy, enforced since 2026-10-14, on the sign-in, account,
# organisation and admin pages, where a visitor's Supabase session is held. The
# sources below are what those pages load: their own scripts (supabase-js is
# served from /js/vendor/), Chart.js from jsDelivr, Google Analytics, Google
# sign-in, Cloudflare Turnstile and the UserWay widget on account.html. Before
# enforcing it every page was loaded in a browser with the policy applied and
# none reported a violation. If one of these pages starts loading something
# new, add its host here, or the browser blocks it with only a console message.

