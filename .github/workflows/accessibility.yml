# Dedicated accessibility testing workflow using axe-core
# Runs on push/PR to main and can be triggered manually
name: Accessibility Tests (axe-core)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  axe-accessibility:
    name: axe-core WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 20
    # Scoped permissions: read the repo, write sticky PR comments.
    # Required by the 'Comment on PR with axe-core results' step below,
    # which uses marocchino/sticky-pull-request-comment@v3.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pages this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          # Up to 30 changed pages, existing on disk; the daily sweep covers the rest.
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- '*.html' \
            | grep -vE '^(Backups|admin|docs|tests|scripts)/' | head -30 > changed-pages.txt || true
          echo "Changed pages to audit: $(grep -c . changed-pages.txt || true)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start local server
        run: npx http-server -p 8080 -s &

      - name: Wait for server
        run: sleep 3

      - name: Run axe-core accessibility tests
        id: axe
        run: |
          set +e
          # Capture combined stdout+stderr to file, but use PIPESTATUS so
          # the upstream exit code is preserved (tee always returns 0).
          # We need both because the axe wrapper writes the human-readable
          # report on both streams.
          npm run test:a11y > axe-results.txt 2>&1
          AXE_EXIT=$?
          # Echo to log so the run is visible in the Actions UI
          cat axe-results.txt
          echo "exit_code=$AXE_EXIT" >> "$GITHUB_OUTPUT"

          # Build a markdown report from the output
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('axe-results.txt', 'utf8');
            let md = '## axe-core Accessibility Audit Results\n\n';
            md += '\`\`\`\n' + raw.replace(/\x1b\[[0-9;]*m/g, '') + '\n\`\`\`\n';
            if ($AXE_EXIT !== 0) {
              md += '\n> **Note:** axe-core detected serious WCAG 2.1 AA violations. Please fix before merging.\n';
            } else {
              md += '\n> All pages passed axe-core accessibility checks.\n';
            }
            fs.writeFileSync('axe-report.md', md);
          "

      - name: Audit the pages this pull request changes
        # Compared with tests/a11y-baseline.json, so only a failure the change
        # introduces fails here; a page's older, recorded problems do not.
        if: github.event_name == 'pull_request'
        run: |
          if [ -s changed-pages.txt ]; then AXE_PAGES_FILE=changed-pages.txt node tests/axe-sweep.js; else echo "No pages changed."; fi

      - name: Upload axe-core report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-accessibility-report
          path: axe-report.md

      - name: Comment on PR with axe-core results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: axe-accessibility-audit
          path: axe-report.md

      - name: Fail on violations
        if: steps.axe.outputs.exit_code != '0'
        run: |
          echo "::error::axe-core accessibility audit failed with WCAG 2.1 AA violations."
          exit 1
