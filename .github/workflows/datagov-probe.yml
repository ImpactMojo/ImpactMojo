# One-off test: can a GitHub runner reach data.gov.in with the DATA_GOV_KEY
# secret? Prints only HTTP status and record counts, never the key.
name: data.gov.in reachability probe
on:
  push:
    branches: [ccr-57e815ee-1ok3uz]
    paths: [.github/workflows/datagov-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the secret set
        env:
          K: ${{ secrets.DATA_GOV_KEY }}
        run: |
          if [ -z "$K" ]; then echo "DATA_GOV_KEY is not set"; exit 1; fi
          echo "DATA_GOV_KEY is set (${#K} characters)"
      - name: Ask data.gov.in for 1000 CPCB readings
        env:
          K: ${{ secrets.DATA_GOV_KEY }}
        run: |
          set +e
          for i in 1 2 3; do
            code=$(curl -sS -m 60 -o out.json -w '%{http_code}' \
              "https://api.data.gov.in/resource/3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69?api-key=$K&format=json&limit=1000")
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          python3 -c "import json;d=json.load(open('out.json'));print('total',d.get('total'),'returned',len(d.get('records',[])),'updated',d.get('updated_date'))" || exit 1
