# Mobile-first guard — fails the build if any key page has horizontal overflow
# at a 390px phone viewport. Renders real pages in headless Chromium.
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  mobile-overflow:
    name: Mobile overflow audit (390px)
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run mobile overflow audit
        run: python3 scripts/mobile/audit.py
