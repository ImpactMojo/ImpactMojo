# CI — content, data and accessibility guards, and HTML validation.
# Note: axe-core accessibility testing is handled by accessibility.yml, and the
# external link crawl by link-check.yml (moved out on 2026-09-08, see #1081 —
# a job cancelled on timeout cancels the entire run with it).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:17 UTC — catches any i18n/encoding regression even with no push.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  encoding:
    name: Encoding / mojibake guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for mojibake / encoding corruption
        run: python3 scripts/check-mojibake.py

  i18n-quality:
    name: i18n translation-quality guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for translation corruption (cross-script, brand, artifacts, char-runs)
        run: python3 scripts/check-i18n-quality.py

  asset-stamps:
    name: Asset stamp freshness
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check asset stamps
        run: python3 scripts/stamp-assets.py --check

  upset-data:
    name: UpSet chart data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Rebuilds both UpSet views from the committed NFHS district file and
      # fails if either the data file or the generated chart script has drifted
      # from it. The build also asserts, before computing anything, that the
      # source's value pairs are still [NFHS-5, NFHS-4] -- later round first.
      # Reading that pair backwards is silent: every figure stays inside its
      # plausible range and simply describes the wrong survey.
      - name: UpSet data matches its source
        run: python3 scripts/build-upset-data.py --check

  mgnrega-data:
    name: MGNREGA explorer data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The raw snapshot is 415,834 district-months and 266 MB, so it is not in
      # the repo and this job checks the drift it still can: the page's inline
      # copy against the committed data file. The source-shape assertions --
      # that the columns are still cumulative within the year, and that the
      # daily snapshots collapse correctly -- run when the data is refreshed.
      - name: Check the MGNREGA page matches its data
        run: python3 scripts/build-mgnrega-explorer-data.py --check

  crime-data:
    name: Crime explorer data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Same triple total-row trap as the prisons data, plus a column-naming
      # one: the same NCRB column is 'charge_sheets_submitted___cases_charge_
      # sheeted__col...' in one table and 'chargesheets_submitted___cases_
      # chargesheeted__col...' in the next, and even the state column is named
      # three different ways. The build matches on letters alone and asserts
      # exactly one hit per column, so a renamed source fails here instead of
      # rendering a page of blanks.
      - name: Rebuild the crime data and compare
        run: python3 scripts/build-crime-explorer-data.py --check

  aqi-data:
    name: Air quality explorer data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The CPCB series is hourly, so a snapshot that quietly mixed two hours
      # would average across time without saying so. The build asserts every
      # reading carries the same timestamp, keeps 'NA' out of the averages
      # instead of counting it as zero, and re-injects the page's inline copy.
      - name: Rebuild the air quality data and compare
        run: python3 scripts/build-aqi-explorer-data.py --check

  justice-data:
    name: Justice explorer data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Every NCRB table carries three total rows -- Total (States),
      # Total (UTs) and Total (All India) -- so summing a column returns
      # exactly three times the real figure, and the court tables double.
      # This rebuilds from the snapshot and refuses to write unless the parts
      # agree with the source's own totals. It also re-runs the cross-source
      # check on Scheduled Tribe population, whose primary table has rows
      # carrying another state's numbers.
      - name: Rebuild the justice data and compare
        run: python3 scripts/build-justice-explorer-data.py --check

  origin-relative-links:
    name: In-site links work on any origin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The site had ~6,200 of its own navigation links written as
      # https://www.impactmojo.in/... On the custom domain that works, so
      # nothing ever looked wrong -- but it meant the site could only be
      # browsed on that one hostname. When DNS for the domain failed on
      # 2026-08-29, every page Netlify was serving perfectly still sent the
      # visitor to a dead host, and the whole site reported them offline.
      # Root-relative links resolve the same on the custom domain and work
      # on netlify.app, deploy previews and localhost too.
      - name: No in-site link hard-codes the canonical host
        run: python3 scripts/make-links-origin-relative.py --check

  csr-data:
    name: CSR explorer data is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # csr.html carries its data inline, so there are two copies of it: the
      # JSON file and the page. This re-derives both from the raw snapshot and
      # fails if either has drifted -- an edit to one and not the other would
      # otherwise render a page of confident, wrong numbers with nothing to
      # show for it. The same run re-checks the joins: both source tables
      # carry a 'Total' row, and summing the column double-counts exactly.
      - name: Rebuild the CSR data and compare
        run: python3 scripts/build-csr-explorer-data.py --check

  diagram-contrast:
    name: Diagram text contrast
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check diagram contrast
        run: python3 scripts/check-diagram-contrast.py

  conflict-markers:
    name: Merge-conflict-marker guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed conflict markers
        run: python3 scripts/check-conflict-markers.py

  internal-links:
    name: Internal-link guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check internal links resolve
        run: python3 scripts/check-internal-links.py

  counts:
    name: Content-count drift guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check content counts match data/counts.json
        run: python3 scripts/check-counts.py

  mobile-search:
    name: Site search is reachable on a phone
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start local server
        run: npx http-server -p 8080 -s &

      - name: Wait for server
        run: sleep 3

      # Measures the search affordance at a 390px viewport and clicks it. This
      # is the only check that would have caught #1062: the button was in the
      # DOM with the right class and a working handler, inside a container the
      # mobile stylesheet sets to display:none, so every desktop check passed
      # while search was unreachable on a phone. axe and pa11y would not report
      # it either -- a zero-size element with an aria-label is a layout outcome,
      # not a WCAG violation.
      - name: Mobile search reachability
        run: node tests/mobile-search.js

      # A bare text node inside a grid container becomes an anonymous grid item
      # and is auto-placed like a cell. On the results chain that put each
      # legend note in the 26px swatch column, ~75px wide and up to 535px tall,
      # one word per line, at every width, from the day the page shipped
      # (#1072). Valid markup, all the text present, contrast and tap targets
      # fine -- so axe passed 64 of 64 variants over it and pa11y 23 of 23
      # pages, twice. A person on a phone found it.
      - name: No text stranded in a grid or flex container
        run: node tests/stray-grid-text.js

  theories:
    name: Theories library build and contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Rebuilds the library from data/theories/ and fails if anything it
      # generates has drifted: a page, the browser data file, the sitemap rows
      # or the search-index rows. It also validates the graphs, where an edge
      # pointing at a renamed node would otherwise be dropped silently and the
      # diagram would keep looking finished.
      - name: Generated files match data/theories/
        run: python3 scripts/build-theories.py --check

      # SVG text on a coloured box, which is the arrangement rules/testing.md
      # item 12 records getting wrong twice. axe does not evaluate SVG text
      # contrast, so nothing else in this workflow would notice.
      - name: Diagram text contrast in both themes
        run: python3 scripts/check-theories-contrast.py

  fix-issues:
    name: Fixes cite an issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Known Issues page can only show defects that were filed. Before this
      # guard, 92 fixes had been written up in the changelog and 3 issues had
      # ever been filed -- so the page showed nothing, correctly, and nothing
      # went red. See docs/bug-reporting.md.
      - name: Every changelog "Fixed" entry cites an issue
        run: python3 scripts/check-fix-issues.py

      - name: Published fix history matches the changelog
        run: python3 scripts/build-fix-history.py --check

  supabase-writes:
    name: Supabase write-path guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Static only: needs no credentials, so it runs on every push. Catches a
      # write whose result is discarded — the shape that hid the dead
      # user_progress sync for eight months, since supabase-js resolves with
      # { data, error } rather than throwing.
      - name: Every Supabase write surfaces its errors
        run: python3 scripts/check-supabase-writes.py

  supabase-writes-live:
    name: Supabase write-path guard (live insert counts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hits the live database, so schedule/dispatch only — same reasoning as
    # supabase-anon below. Skips gracefully when SUPABASE_PAT is absent.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Assert every written table has ever received a row
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: python3 scripts/check-supabase-writes.py --live

  supabase-anon:
    name: Supabase anon-exposure guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    # Hits the live PostgREST API, so it runs on the daily schedule and on
    # demand — not on every PR, where third-party latency would add flake and
    # contributors can't act on the result anyway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Probe anon exposure against the expected contract
        run: python3 scripts/check-supabase-anon.py

  edge-functions:
    name: Edge Function boot check
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    # Hits the live Functions gateway, so it runs on the daily schedule and on
    # demand -- not on every PR, where third-party latency would add flake and
    # a contributor could not act on the result.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # The functions import supabase-js from esm.sh at cold start. A broken
      # import does not fail at deploy time -- it fails on the next cold start,
      # as a 500 only the caller sees.
      - name: Probe every Edge Function boots and runs its own code
        run: python3 scripts/check-edge-functions.py

  book-companions:
    name: Book-companion blank-page guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check every companion has renderable DATA (no blank pages)
        run: python3 scripts/check-book-companions.py

  service-worker:
    name: Service worker behaviour test
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test service worker routing & lifecycle
        run: node scripts/test-service-worker.mjs

  nav-dots:
    name: Nav "recently updated" dots
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The dots were two hardcoded spans that never expired: three weeks on
      # they still claimed Libraries and Field Radio were fresh, while the blog
      # -- which held the two newest items on the site -- carried none.
      - name: Check the nav dots match the content dates
        run: python3 scripts/stamp-nav-dots.py --check

  html-nesting:
    name: Blog markup nests correctly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A missing </div> does not error and does not show up in any other guard:
      # the page still renders, with the later blocks nested inside the earlier
      # one and inheriting its styles. That shipped an unreadable newsletter
      # button in #1033, and had been sitting latent in a second post.
      - name: Check block markup in blog/
        run: python3 scripts/check-html-nesting.py

  viewport:
    name: Viewport meta guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Without a viewport meta a phone lays the page out at desktop width and
      # zooms out, so the text arrives too small to read. Nothing errors and the
      # page looks right on the machine it was built on. testing.md has required
      # this since the file existed, as a manual step.
      - name: Check every page declares a viewport
        run: python3 scripts/check-viewport.py

  css-vars:
    name: CSS custom properties resolve
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # An undefined var() is invalid at computed-value time: a background goes
      # transparent, and inside a shorthand the whole declaration is dropped.
      # On 2026-08-21 that meant every callout in ELEVEN flagships painted
      # transparent, and law's reflection prompts had no border -- all live, and
      # green in axe, pa11y and the contrast guard, because a component that
      # isn't painted has no contrast to fail.
      - name: Check every var() resolves
        run: python3 scripts/check-css-vars.py

  judgments:
    name: Development Law Docket integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Every judgment is sourced and its status stated
        run: python3 scripts/check-judgments.py
      - name: Law guides match the dataset
        run: python3 scripts/build-law-guide-cases.py --check

  budget:
    name: Union Budget data matches its source
    runs-on: ubuntu-latest
    # data/union-budget.json is extracted from a vendored workbook, and every
    # figure on /fiscal.html is a government number a reader may act on. If the
    # JSON is edited by hand, or the workbook is swapped for a new year without
    # re-running the extractor, the page shows numbers that are in no published
    # document. This fails on that.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: pip install --quiet openpyxl
      - name: Budget JSON matches the workbook
        run: python3 scripts/build-budget-data.py --check
      - name: Historical series is internally consistent
        # Checks the built file against itself rather than the PDFs, which are
        # not committed: consecutive budget documents must agree where they
        # overlap, and each year's heads must sum to that year's own published
        # Grand Total. The second caught a sub-row being counted as a head,
        # which had overstated every older year by 2-6%.
        run: python3 scripts/build-budget-history.py --check

  decks:
    name: 101 deck density
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The flagships had a written standard and drifted anyway. The 52 decks
      # had no standard at all, so nobody could tell a thin deck from a dense
      # one without opening it. Measured 2026-08-22: 41 decks sit at 67-81
      # words/slide and 11 at 140-227, with nothing in between -- a uniform
      # ~100-slide shell whose content varies 3.4x.
      - name: Check deck density and the rewrite backlog
        run: python3 scripts/check-decks.py

  studio-submit:
    name: Studio submissions and gradebook CSV
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A submission that loses its identity is a file an instructor cannot
      # mark, which is the exact gap this feature closes. And CSV quoting that
      # breaks on a comma shifts every later column, so a gradebook import
      # attributes work to the wrong student -- course names like
      # "Sustainability, ESG, CSR and M&E" contain commas as a matter of course.
      - name: Check submission envelopes and CSV quoting
        run: node scripts/test-studio-submit.mjs

  lms-export:
    name: LMS export packages
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The export builds SCORM / Common Cartridge packages in the visitor's
      # browser. Both failure modes are invisible here and expensive there: a
      # manifest identifier that is not a valid XML NCName (course slugs like
      # "101-csr-esg" start with a digit, which NCName forbids) is rejected at
      # import with an unhelpful error, and a completion signal that fires on
      # open marks every student passed. This drives the SCORM wrapper against a
      # mock LMS API and asserts completion fires once, at the last slide.
      - name: Check manifests and SCORM runtime behaviour
        run: node scripts/test-lms-export.mjs

  heading-survives-chrome:
    name: Heading survives site-chrome
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # site-chrome.js removes, at runtime, any <header>/<nav> that is a direct
      # child of <body>. That is deliberate -- it strips legacy per-page nav bars
      # so the shared top bar can be injected -- but a page whose <h1> lives in
      # that header ships a heading nobody ever sees, and anything else in there
      # goes with it. On 2026-08-21 that was 24 pages, and on three of them it
      # was taking real UI: the Gandhian Lexicon's search box and category
      # filter, the LogFrame Builder's Import/Example/Reset buttons, and the
      # Public Choice lexicon's term counter. Nothing was red. axe-core tests 10
      # hardcoded pages and pa11y-ci 19; none of the 24 were in either list, and
      # a new page joins neither list by default -- so the check has to be
      # structural and sitewide rather than page-by-page.
      - name: Check every heading survives the chrome strip
        run: python3 scripts/check-h1-survives-chrome.py

  homepage-courses:
    name: Homepage lists every flagship
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Adding a flagship updates counts.json, the catalog, the sitemap, the
      # search index, the offline cache and the certificate map. Nothing
      # updated index.html, so three of twenty-one courses had zero references
      # on the front page and the JSON-LD told search engines there were 18
      # (#1085). A course missing from the resume map also loses its
      # "continue where you left off" card, silently.
      - name: Every course directory appears on the homepage
        run: python3 scripts/check-homepage-courses.py

  search-coverage:
    name: Site-search coverage
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The sitemap is what we tell Google exists; the search index is what our
      # own visitors can find. They had drifted 127 pages apart -- posters,
      # reading companions, course lexicons and premium tools were live and
      # crawlable and site search returned none of them, because adding a page
      # updates the sitemap and the index is a separate file nobody must touch.
      - name: Check every sitemap page is findable in site search
        run: python3 scripts/check-search-coverage.py

  social-images:
    name: Social preview image guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A missing og:image is invisible from inside the site: the page renders
      # perfectly and only shares without a picture, on somebody else's
      # timeline. Four were live when this was written, including a blog post
      # published the same morning.
      - name: Check every social preview image resolves
        run: python3 scripts/check-social-images.py

  theme-contrast:
    name: Theme contrast (both themes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A colour is only ever half-chosen: a value picked against one theme's
      # surfaces can be unreadable against the other's, and the page looks
      # fine either way. .card-number carried a comment recording the 6.90:1
      # it was fixed to in light; in dark the same ink was 1.37:1. axe runs
      # both themes but only ten pages and never a :hover state; pa11y runs
      # the default theme only.
      - name: Check every colour pair clears AA in both themes
        run: python3 scripts/check-theme-contrast.py

  min-css-fresh:
    name: Minified CSS matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # index.html loads css/imx-main.min.css. There was no script to build it,
      # so an edit to the source silently failed to reach the busiest page on
      # the site -- the contrast fixes landed in imx-main.css while the min
      # copy still served the old values.
      - name: Check imx-main.min.css is not stale
        run: python3 scripts/build-min-css.py --check

  tap-traps:
    name: Invisible tap-blocking overlays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # An opacity-0 element still receives taps. The mobile menu backdrop was
      # displayed unconditionally on phones, so every tap on blog.html landed
      # on an invisible full-viewport div and no blog post could be opened.
      # Nothing rendered wrong and nothing errored.
      - name: Check no invisible overlay swallows taps
        run: python3 scripts/check-tap-traps.py

  fundamentals-index:
    name: Fundamentals index counts what ships
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The landing page said "Four so far" while listing five frameworks, for
      # as long as the fifth had been live. check-counts.py scans root-level
      # pages for platform totals and does not reach this one; a person found
      # it by reading the page.
      - name: Check the Fundamentals index counts and links its frameworks
        run: python3 scripts/check-fundamentals-index.py

  fundamentals-privacy:
    name: Fundamentals questionnaire privacy guard
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The wheel's twelve questions cover caste, sexual orientation, religion
      # and disability, and the page promises the answers never leave the
      # browser. That promise is about code, so it is checked by code: the
      # questionnaire files must contain no network primitive at all, and the
      # page must still carry the promise.
      - name: Check the questionnaire cannot transmit
        run: python3 scripts/check-fundamentals-privacy.py

  form-submission:
    name: Form submission contract tests
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Both guard the same class of bug: fetch() resolves on 404 and 500, so a
      # handler that only wires .catch() reports a rejected submission as
      # received. That shipped on all 69 form handlers and silently lost work.
      - name: Test the shared Netlify submit helper
        run: node scripts/test-form-submit.mjs

      - name: Test the challenge-submit endpoint's validation gate
        run: node scripts/test-challenge-submit.mjs

      - name: Test the generic form-submit endpoint's allowlist and caps
        run: node scripts/test-form-submit-endpoint.mjs

  judgment-sources:
    name: Judgment source PDFs resolve
    runs-on: ubuntu-latest
    # Network-dependent, like supabase-anon: a contributor cannot act on
    # somebody else's S3 being slow, so this runs on the schedule and on
    # demand rather than gating every pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check every judgment source_url resolves
        run: python3 scripts/check-judgment-sources.py

  accessibility:
    name: Accessibility audit (pa11y-ci)
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 20
    # Scoped permissions: read the repo, write sticky PR comments.
    # Required by the 'Comment on PR with accessibility results' step below,
    # which uses marocchino/sticky-pull-request-comment@v3.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pa11y-ci and http-server
        run: npm install -g pa11y-ci http-server

      - name: Start local server
        run: npx http-server -p 8080 -s &

      - name: Wait for server
        run: sleep 3

      - name: Run pa11y-ci accessibility audit
        id: pa11y
        run: |
          set +e
          # Direct redirection: stdout (JSON) -> file, stderr -> log.
          # Avoids `tee` + `2>&1` which mixes stderr into the JSON file and
          # can corrupt or truncate the output. Also avoids PIPESTATUS pitfalls
          # since there's no pipe — $? is pa11y-ci's exit code directly.
          pa11y-ci --config .pa11yci --json > pa11y-results.json
          PA11Y_EXIT=$?
          echo "pa11y-results.json size: $(wc -c < pa11y-results.json) bytes"
          # Extract summary from JSON output for the report.
          # pa11y-ci --json emits a single top-level JSON object to stdout, but
          # `2>&1 | tee` mixes stderr (status messages) into the same file. We
          # use depth-counted brace walking to extract the first balanced JSON
          # object instead of relying on indexOf/lastIndexOf which break when
          # there's extra output before/after the JSON.
          node -e "
            const fs = require('fs');
            try {
              const raw = fs.readFileSync('pa11y-results.json', 'utf8');
              const start = raw.indexOf('{');
              if (start === -1) {
                fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nNo JSON output produced. Check workflow logs.\n');
                process.exit(0);
              }
              // Walk forward from the first { counting depth, respecting strings
              let depth = 0, end = -1, inString = false, escape = false;
              for (let i = start; i < raw.length; i++) {
                const c = raw[i];
                if (escape) { escape = false; continue; }
                if (c === '\\\\') { escape = true; continue; }
                if (c === '\"') { inString = !inString; continue; }
                if (inString) continue;
                if (c === '{') depth++;
                else if (c === '}') {
                  depth--;
                  if (depth === 0) { end = i; break; }
                }
              }
              if (end === -1) {
                fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nIncomplete JSON output. Check workflow logs.\n');
                process.exit(0);
              }
              const data = JSON.parse(raw.slice(start, end + 1));
              let md = '## Accessibility Audit Results (WCAG 2.1 AA)\n\n';
              const total = data.total || 0;
              const passes = data.passes || 0;
              const errors = data.errors || 0;
              md += '| Metric | Count |\n|--------|-------|\n';
              md += '| Pages tested | ' + total + ' |\n';
              md += '| Pages passed | ' + passes + ' |\n';
              md += '| Pages with errors | ' + errors + ' |\n\n';
              if (data.results) {
                for (const [url, issues] of Object.entries(data.results)) {
                  if (issues.length > 0) {
                    const page = url.replace('http://localhost:8080/', '');
                    md += '<details><summary>' + page + ' (' + issues.length + ' issues)</summary>\n\n';
                    issues.forEach(i => {
                      md += '- **' + i.type + '**: ' + i.message + '\n';
                      if (i.selector) md += '  - Selector: \`' + i.selector + '\`\n';
                    });
                    md += '\n</details>\n\n';
                  }
                }
              }
              if (errors > 0) {
                md += '> **Note:** Critical WCAG 2.1 AA violations detected. Please fix before merging.\n';
              } else {
                md += '> All pages passed accessibility checks.\n';
              }
              fs.writeFileSync('pa11y-report.md', md);
            } catch(e) {
              // Surface the actual error so we can debug parser failures.
              const msg = (e && e.message) ? e.message : String(e);
              fs.writeFileSync('pa11y-report.md', '## Accessibility Audit Results\n\nFailed to parse results: ' + msg + '\n\nSee workflow logs for details.\n');
              console.error('parser error:', msg);
            }
          "
          echo "exit_code=$PA11Y_EXIT" >> "$GITHUB_OUTPUT"

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            pa11y-report.md
            pa11y-results.json

      - name: Comment on PR with accessibility results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: accessibility-audit
          path: pa11y-report.md

      - name: Fail on critical violations
        if: steps.pa11y.outputs.exit_code != '0'
        run: |
          echo "::error::Accessibility audit failed with critical WCAG 2.1 AA violations."
          exit 1

  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    # Without this a hung step inherits GitHub's 360-minute default and the
    # job neither passes nor fails -- which reads as "still running".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate key pages
        run: |
          html-validate \
            --config '{"extends":["html-validate:recommended"],"rules":{"no-inline-style":"off","no-trailing-whitespace":"off","attribute-boolean-style":"off","element-permitted-content":"off","heading-level":"off"}}' \
            index.html login.html signup.html premium.html about.html || true
