SUPPLEMENTARY SOURCE — FRONTIER ECONOMICS (2022):
"Value for Money in Theory-Based Evaluation" (Frontier Economics, 04 October 2022)

VFM CONCEPT: VfM is about the optimal use of public funding — the relationship between costs and benefits ('bang for the buck'), not minimising cost. The Green Book (HM Treasury) defines it as "a judgment about the optimal use of public resources to achieve stated objectives … based on consideration of present value to society of all social, economic and environmental benefits … and present public resource costs."

THE NAO FOUR Es FRAMEWORK: Economy (procuring inputs at lowest cost), Efficiency (maximum output from given inputs), Effectiveness (achieving intended outcomes), Equity (fair distribution of benefits).

APPRAISAL VS EVALUATION DISTINCTION:
- VfM in appraisal (ex ante): tool for choosing between policy options; based on forecast benefits using theory, modelling, literature.
- VfM in evaluation (ex post): demonstrating that the chosen option delivered benefits worth the cost; based on measured outcomes from the impact evaluation.
The Magenta Book (HM Treasury) stresses VfM evaluation sits alongside process and impact assessment as part of best practice evaluation: "While impact demonstrates and quantifies outcomes, it cannot on its own assess whether those outcomes are justified. Value-for-money evaluation considers such issues, including whether the benefits of the policy are outweighed by the costs."

THE VFM CHAIN (Figure 1 in Frontier bulletin):
Activities and outputs → (measure) → Outcomes and impacts attributed to the intervention → (adjust for additionality: deadweight, displacement, substitution, leakage) → (adjust for double counting) → Economic and social value of measured outcomes (benefits) → (discount to present values) → Value for Money
Public service costs of delivery (costs) → (discount to present values) → Value for Money

THREE KEY CHALLENGES IN THEORY-BASED VfM EVALUATION:
1. Long lags: benefits may not be observable during evaluation; reliance on predicted future benefits or proxy leading indicators.
2. Intangible benefits: hard to measure let alone monetise; VfM may only be demonstrable for a subset of total benefits.
3. Imprecise additionality: theory-based evaluation cannot robustly quantify additionality, making it hard to size benefits.

SIX LESSONS FROM FRONTIER'S PRACTICE:
1. Build VfM into the design of the theory-based evaluation — collect cost data and monetisable outcome data from the start.
2. Consider impact evaluation and VfM evaluation together — include an explicit VfM question in the evaluation framework.
3. Know the audience — if results will underpin future funding bids, scope must include strategic fit and scenario analysis.
4. Avoid double counting — use the theory of change to identify genuinely distinct benefit pathways; focus on final impacts.
5. Be realistic about limits of monetisation — if monetisable benefits already exceed costs, a narrative of wider benefits is more persuasive than speculative monetisation of everything.
6. Use 'what if' questions — "how large must non-monetised benefits be for BCR to remain above 1?" uses threshold analysis to handle uncertainty without abandoning the VfM exercise.
7. Don't neglect social benefits — environmental (carbon values), health (QALYs), and wellbeing (WELLBYs) benefits are now routinely included in Green Book appraisals and can be applied to evaluation evidence.

STRATEGIC FIT (Green Book emphasis): policy options must demonstrate "holistic fit and synergy with other strategies, programmes and projects" — strategic case comes before and constrains the VfM appraisal.

DOUBLE COUNTING RISK: the biggest risk in theory-based VfM. Multiple benefit pathways may overlap. Solution: use theory of change to map distinct pathways to final impacts; err on side of caution; fewer well-grounded pathways are more credible than many speculative ones.

AUTHOR: Gisela Kobelt, PhD (Karolinska Institute), MBA (IMD Lausanne). Managing Director of European Health Economics France. Former VP Corporate Health Economics at Pharmacia & Upjohn. Visiting professor, University of Lund. Over 90 scientific publications.

PURPOSE: An introduction to health economic evaluation methods for analysts, policymakers, and clinicians. Illustrates methods with real case studies primarily from drug evaluations.

CHAPTER 1 — HEALTH ECONOMICS: GENERAL ISSUES
Health economics applies economic theory, tools, and concepts to health and health care — specifically the allocation of scarce resources to improve health.

Context: Total health care spending as a share of GDP has risen in all OECD countries. US: 6.9% (1970) to 17.7% (2010). OECD average: 5.8% (1970) to 9.3% (2010). Contributing factors: ageing populations, technology innovation, rising patient expectations, chronic disease burden.

Why health care is different (Box 1.1 issues): Uncertainty about need, outcome, and cost. Information asymmetry between patients and providers. Externalities (e.g. infectious disease). Public good elements. Equity concerns — access cannot be determined purely by ability to pay.

Health technology assessment (HTA): "A multidisciplinary process that summarises information about the medical, social, economic and ethical issues related to the use of a health technology throughout its life span in a systematic, transparent, unbiased and robust manner. The aim of HTA is to inform the formulation of safe and effective health policies that are patient-focused and seek to achieve value for money."

Market access context: Regulatory approval (safety/efficacy) is necessary but not sufficient for market access. Countries increasingly require economic evaluation alongside clinical evidence for reimbursement decisions. Key HTA bodies: NICE (UK), PBAC (Australia), CADTH (Canada), HAS (France), IQWiG (Germany), and HTAIn (India).

Role of economic evaluation during drug development: Informs early decisions about which compounds to develop; helps design clinical trials to capture economic endpoints; determines positioning and price post-approval.

CHAPTER 2 — FORMS OF HEALTH ECONOMIC EVALUATION

Four types of economic evaluation, all comparing costs and outcomes of two or more alternatives:

1. COST-MINIMISATION ANALYSIS (CMA): Used when outcomes are equivalent across alternatives. Compare costs only. Least commonly appropriate — clinical equivalence must be demonstrated, not assumed.

2. COST-EFFECTIVENESS ANALYSIS (CEA): Outcomes measured in natural units — life years gained, cases prevented, events avoided. Result expressed as cost per unit of outcome (e.g. cost per life year gained). Allows comparison within a therapeutic area but not across disease areas.

3. COST-UTILITY ANALYSIS (CUA): Outcomes measured in QALYs (quality-adjusted life years). Integrates length and quality of life. Result expressed as cost per QALY. Allows comparison across disease areas. Preferred method by most HTA agencies.

4. COST-BENEFIT ANALYSIS (CBA): Both costs and outcomes expressed in monetary terms (willingness to pay). Allows comparison across sectors of the economy. Less common in health care due to ethical objections to monetary valuation of health.

OUTCOME MEASUREMENT:
- Physiological measures and clinical events: Blood pressure, tumour response, infection rates — intermediate endpoints that must be linked to final outcomes.
- Survival: Life years gained (LYG). Important to extrapolate beyond trial period using modelling.
- Quality-adjusted life years (QALYs): A QALY is one year of life in full health (utility = 1.0). One year in a health state with utility 0.6 = 0.6 QALYs. QALYs = utility × time. Calculates the area under the utility-over-time curve.
- Patient-reported outcomes (PROs): Generic (SF-36, EQ-5D) and disease-specific instruments. Generic preference-based measures required for QALY calculation.

COST DATA:
Direct costs: Medical costs to the health care system (drugs, hospitalisation, consultations, monitoring) and direct non-medical costs (transport, informal care by family members).
Indirect costs: Lost production — short-term sickness absence, long-term disability, premature death (productivity losses using human capital method or friction cost method).
Intangible costs: Suffering and loss of quality of life — captured in QALY framework, not usually added separately.

Perspectives: What costs are included depends on the adopted perspective:
- Societal perspective: All costs regardless of who bears them — recommended as the primary perspective for capturing full value.
- Health care payer perspective: Costs to the payer/insurer only.
- Budget perspective: Impact on a specific budget.
The perspective drives which costs are included and can materially change the ICER.

Steps in cost assessment: (1) identify all relevant resource items, (2) measure quantity of each resource, (3) value each resource at appropriate unit cost, (4) sum total cost per patient.

COST-OF-ILLNESS STUDIES:
Quantify the aggregate economic burden of a disease — used to justify research investment or evaluate the potential value of a preventive or curative intervention.
- Prevalence-based: Total costs of all cases existing in a year. Useful for budget planning. Example: Rheumatoid arthritis — HAQ score correlates with cost, showing that effective treatment reducing disability also reduces cost.
- Incidence-based: Lifetime costs of new cases arising in a year (discounted). More appropriate for evaluating prevention.
Costing approaches: Top-down (aggregate data divided by disease) vs bottom-up (individual patient level data on resource use and unit costs multiplied together). Bottom-up is more accurate and increasingly standard.

CHAPTER 3 — ANALYTICAL APPROACHES TO ECONOMIC EVALUATION

DECISION ANALYSIS AND MODELLING:
Decision trees: Represent a sequence of events and decisions. Each branch leads to health states with associated probabilities and costs. Suitable for acute conditions with short time horizons.

Markov models: For chronic conditions requiring a long time horizon. Patients move between defined health states (e.g. stable disease, progressive disease, dead) in discrete time cycles. Transition probabilities determine movement. Each state has an associated cost and utility. Results: cumulative costs and QALYs over the model's time horizon. More realistic than decision trees for long-term diseases.

Key model requirements: States must be mutually exclusive and exhaustive. Markovian assumption: transition probabilities depend only on current state, not history (memory-less). Tunnel states can be used to relax the memory-less assumption.

COST-EFFECTIVENESS ANALYSIS IN PRACTICE:

The ICER (incremental cost-effectiveness ratio):
ICER = (Cost_new - Cost_comparator) / (Effect_new - Effect_comparator)
= ΔCost / ΔEffect

The CE plane: Four quadrants defined by ΔCost (y-axis) and ΔEffect (x-axis).
- North-East: New treatment costs more AND is more effective (most common) — decision depends on WTP threshold
- South-East: New treatment costs less AND is more effective — dominant, accept
- South-West: New treatment costs less BUT is less effective — accept only if cost savings justify the loss
- North-West: New treatment costs more AND is less effective — dominated, reject

WTP threshold (lambda): The maximum amount a payer is willing to pay per unit of effectiveness. In the UK, NICE uses £20,000–£30,000 per QALY as an indicative threshold. Australia: ~AUD $42,000–$76,000 per QALY. There is no single internationally accepted threshold.

Cost-effectiveness acceptability curves (CEACs): Show the probability that a treatment is cost effective at different WTP thresholds. Derived from probabilistic sensitivity analysis. Recommended for presenting uncertainty in ICERs.

Technical issues:
- Discounting: Future costs and benefits discounted to present value. UK NICE: 3.5% per year for both costs and effects. Rationale: time preference (we prefer benefits now), opportunity cost of capital. Effect on results: treatments with upfront costs and delayed benefits look less cost effective when discounted.
- Patient subgroups: May be appropriate to analyse cost-effectiveness in subgroups defined by disease severity, biomarker status, or prior treatment.
- Meta-analysis and network meta-analysis: Where no head-to-head trials exist, indirect comparisons via a network can generate comparative effectiveness evidence.

COST-UTILITY ANALYSIS AND UTILITIES:

Utility values range from 0 (dead) to 1 (full health). Negative values possible for states worse than death.

Methods for eliciting utilities:
1. Standard gamble (SG): Respondent chooses between (a) intermediate health state for certain, and (b) a gamble offering either full health (probability p) or death (probability 1-p). The probability p at indifference = utility of the health state. Theoretically preferred because grounded in expected utility theory.

2. Time trade-off (TTO): Respondent chooses between (a) t years in full health then death, and (b) longer time in intermediate health state. The ratio t/T (at indifference) gives the utility. x/t. Easier to administer than SG. Preferred by NICE.

3. Visual analogue scale (VAS): Mark health state on a line from 0 to 1. Fastest but not preference-based — scores generally lower than SG or TTO.

4. Multi-attribute utility instruments (MAUIs): Pre-scored instruments using general population preferences. EQ-5D (5 dimensions: mobility, self-care, usual activities, pain/discomfort, anxiety/depression — each with 3 or 5 levels). EQ-5D-3L generates 243 health states. SF-6D (derived from SF-36). Health Utilities Index (HUI). These are scored using population-based tariffs — not individual patient preferences.

EQ-5D: The most widely used MAUI. UK NICE requires EQ-5D for QALY calculations. Respondent selects level on each dimension; health state profile converted to a single index using country-specific population tariffs. EQ-VAS thermometer (0–100) also collected but not used for QALY calculation.

COST-BENEFIT ANALYSIS:
Contingent valuation: Survey method asking individuals their maximum WTP for a defined health improvement. Discrete choice experiments (DCE) ask individuals to choose between scenarios with different attributes at different prices. CBA allows comparison across sectors (education, transport, health) but controversial in health — ethically fraught to attach monetary value to life or health.

CHAPTER 4 — GUIDELINES FOR ECONOMIC EVALUATION
Australia: First country (1993) to require economic studies for reimbursement (PBAC guidelines). Canada: Required nationally and provincially; widely authoritative guidelines (CADTH). UK: NICE technology appraisals are binding; prefers EQ-5D for utilities, 3.5% discount rate, societal perspective for costs. Germany: IQWiG assesses added benefit; cost-effectiveness only if requested. US: No mandatory HTA; AMCP guidance for submissions; cost-effectiveness is politically controversial (QALY use restricted in Medicare decisions). France: HAS assesses benefit rating (ASMR), sets price based on added benefit.

Key methodological questions in guidelines: Which comparator? What perspective? Which outcomes? How to treat uncertainty? What discount rates? How to handle subgroups?

CHAPTER 5 — CONCLUSIONS
Economic evaluation is increasingly required for market access globally. Sound methodology and relevant data, transparently reported, are the preconditions for useful studies. The primary purpose of economic evaluation is to inform resource allocation decisions, not hypothesis testing. "Negative" results (high ICER) identify settings where a treatment is not cost effective — equally important information for decision makers. Future challenges: Real-world evidence, value of information, adaptive pathways, personalised medicine, broader value frameworks beyond QALYs.

GLOSSARY KEY TERMS: 
ICER = (ΔCost)/(ΔEffect). 
QALY = utility × time, ranging 0–1. 
Threshold ICER = maximum WTP per QALY.
Standard gamble: p at indifference gives utility.
Time trade-off: x/t at indifference gives utility.
Discounting: PV = FV / (1+r)^t.

ackage design and provider payment rates.`},{num:2,title:`Forms of Health Economic Evaluation`,col:`#0891b2`,summary:`Introduces the four main types of economic evaluation, outcome measurement approaches, and cost frameworks. All four evaluation types compare at least two alternatives on both costs and consequences. The choice of method depends primarily on whether outcomes can be assumed equivalent (CMA), measured in natural units (CEA), expressed as QALYs (CUA), or valued in money (CBA). The QALY — one year of life in full health — is the dominant outcome measure for multi-disease comparisons and is required by most HTA agencies.`,keyPoints:[`Cost-minimisation analysis (CMA): compare costs only when outcomes are equivalent — clinical equivalence must be proven, not assumed`,`Cost-effectiveness analysis (CEA): outcomes in natural units (life years, events); allows within-disease comparisons but not across diseases`,`Cost-utility analysis (CUA): outcomes in QALYs; allows cross-disease comparisons; preferred by NICE, PBAC, and most HTA agencies`,`Cost-benefit analysis (CBA): outcomes in monetary terms (WTP); allows comparison across all sectors; controversial due to ethical objections`,`Perspective drives which costs count: societal perspective captures all costs regardless of who bears them; payer perspective captures only reimbursable costs`],saNote:`India's National List of Essential Medicines and NPPA price controls reflect implicit cost-effectiveness judgements but without systematic QALY-based analysis. HTAIn is moving toward explicit cost per DALY and cost per QALY thresholds, drawing on India's own GDP per capita as a rough benchmark (WHO's 1–3× GDP per capita per DALY averted from the CMH report).`},{num:3,title:`Analytical Approaches to Economic Evaluation`,col:`#7c3aed`,summary:`The technical core of the book. Covers decision analytic modelling (decision trees and Markov models), the ICER and CE plane, cost-effectiveness acceptability curves, technical issues (discounting, subgroups, indirect comparisons), cost-utility analysis and utility elicitation methods (standard gamble, TTO, VAS, EQ-5D), and cost-benefit analysis via contingent valuation. Illustrated throughout with detailed case studies including rheumatoid arthritis, multiple sclerosis, toenail fungal infection, and hormone replacement therapy.`,keyPoints:[`Markov models: patients transition between health states (e.g. stable, progressive, dead) in cycles; accumulate costs and QALYs over long time horizons — standard for chronic disease`,`ICER = ΔCost / ΔEffect: the additional cost of gaining one additional unit of health. Located on the CE plane by ΔCost (y) and ΔEffect (x) — North-East quadrant requires comparison to WTP threshold`,`Discounting: future costs and effects reduced to present value at 3.5%/year (UK) — treatments with upfront costs and delayed benefits appear less cost-effective when discounted`,`Standard gamble: utility = probability of full health at indifference in a gamble vs. certain intermediate state. Theoretically grounded in expected utility theory`,`EQ-5D: five-dimension generic instrument (mobility, self-care, activities, pain, anxiety); population tariffs convert health states to 0–1 utility scores; required by NICE`],saNote:`India's HTAIn has adopted the EQ-5D-3L and EQ-5D-5L for utility measurement in HTA submissions. The challenge is that EQ-5D tariffs are derived from UK/European population preferences — applying these to Indian health states involves a systematic cultural and contextual mismatch. HTAIn has initiated work on India-specific preference-based tariffs, though this is not yet complete.`},{num:4,title:`Guidelines for Economic Evaluation`,col:`#166534`,summary:`Reviews the landscape of national and international guidelines for economic evaluation. Australia (1993) was the first country to require formal economic submissions for drug reimbursement. Canada followed, and its CADTH guidelines are widely considered the methodological gold standard. NICE in the UK makes technology appraisal recommendations binding on the NHS, with a preference for EQ-5D utilities and an indicative £20,000–£30,000 per QALY threshold. Germany's IQWiG focuses on added benefit assessment. The US has no mandatory HTA, and QALY use in Medicare decisions was legally restricted (though debated).`,keyPoints:[`Australia (PBAC, 1993): first mandatory submission requirement; submissions require head-to-head comparisons, incremental analysis, and sensitivity analysis`,`Canada (CADTH, 1994/2006/2009): authoritative methodological guidelines; influential on most subsequent national guidelines`,`UK NICE: binding technology appraisals; EQ-5D for utilities; 3.5% discount rate; £20–30k per QALY threshold; end-of-life premium; coverage with evidence development`,`Germany IQWiG: added benefit assessment first; cost-effectiveness only if requested; no explicit QALY threshold`,`Two types of guidelines: reimbursement guidelines (mandatory format requirements) and methodological guidelines (best-practice recommendations by researchers)`],saNote:`India's HTAIn published its Guidelines for Economic Evaluation (2018, updated 2020) closely modelled on CADTH and NICE. Key features: incremental analysis required, comparator should be standard of care in India, societal perspective recommended, discount rate 3%/year, cost-effectiveness threshold is not formally defined but informal benchmarks of INR 1–3 lakh per QALY have been discussed in the literature.`},{num:5,title:`Conclusions`,col:`#b45309`,summary:`Synthesises the key messages and looks ahead to emerging challenges in health economic evaluation. The primary purpose of economic evaluation is to support resource allocation decisions — not to generate publication. Sound methodology and relevant data, transparently reported, are the preconditions for useful studies. Negative results (high ICERs) are not failures — they identify settings where a treatment is not cost effective, which is equally valuable information for decision makers.`,keyPoints:[`Economic evaluation supports resource allocation: the question is not 'is this treatment effective?' but 'is this treatment worth what it costs compared to alternatives?'`,`Results must be credible and decision-relevant: methodology must be sound, data must be locally relevant, reporting must be transparent`,`Future challenges: real-world evidence integration, value of information analysis, adaptive pathways, personalised medicine, and extending value frameworks beyond QALYs`,`The BMJ checklist (Figure 5.1) provides a practical quality assessment tool for reviewing or conducting economic evaluation studies`,`HTA is expanding globally — more countries are developing mandatory submission requirements and building capacity for economic evaluation`],saNote:`India faces distinct challenges: limited local utility data, fragmented cost data across public and private sectors, wide regional variation in prices and practice patterns, and the need to adapt methods designed for high-income country drug evaluation to a context where off-patent generics dominate. HTAIn's work on expanding to devices, diagnostics, and public health interventions reflects the next wave of HTA development.`}],C=[{id:`cma`,label:`Cost-Minimisation Analysis`,short:`CMA`,col:`#6b7280`,when:`Use only when clinical trials or systematic reviews demonstrate outcomes are equivalent across the alternatives being compared. Equivalence must be proven, not assumed.`,howItWorks:`Compare total costs of the alternatives. The lower-cost option is preferred. No need for outcome measurement beyond establishing equivalence.`,formula:`Result: Lower-cost alternative preferred

PSA: ICER_i from sample of all parameter distributions
CEAC: P(cost-effective at λ) = proportion of iterations below λ`,strengths:[`Makes uncertainty explicit and quantified rather than hidden`,`CEAC communicates the probability of cost-effectiveness at any threshold`,`Identifies the parameters most worth collecting better data on (value of information)`],limitations:[`Parameter correlations are difficult to incorporate correctly in PSA`,`Structural uncertainty (model design choices) cannot be captured in standard PSA`,`Results can be presented selectively to support a favourable conclusion`],example:`CEAC for drug A vs comparator: at £20,000/QALY, 15% probability cost-effective. At £30,000/QALY, 45% probability. At £50,000/QALY, 78% probability. Decision depends on the payer's threshold. Tornado diagram shows transition probabilities and utility values drive the ICER more than unit drug costs.`},{id:`vfm`,label:`VfM in Theory-Based Evaluation`,short:`VfM-TBE`,col:`#7f1d1d`,when:`Use when evaluating complex, long-running programmes where randomised or counterfactual methods are not feasible or proportionate — innovation funds, industrial strategy, R&D support, multi-year social programmes. The framework comes from Frontier Economics (2022), drawing on the UK Treasury's Green Book and Magenta Book. It applies equally to health programme evaluations, not just economic policy.`,howItWorks:`Theory-based evaluation builds a theory of change for the policy, develops testable hypotheses from that theory, and gathers evidence to test them. VfM assessment sits alongside — not separate from — the impact evaluation. The chain runs: activities and outputs → measured outcomes and impacts (adjusted for additionality) → economic and social value of those impacts (monetised) → discounted to present value → compared with discounted delivery costs. The result is a benefits-to-costs ratio or net present value.

Appraisal vs evaluation distinction: in appraisal (ex ante), VfM is a tool for choosing between options; in evaluation (ex post), VfM demonstrates that the option chosen was worth the cost. The evidence base is different — evaluation uses measured outcomes, not forecast ones.`,formula:`NPV = PV(benefits) − PV(costs)
BCR = PV(benefits) / PV(costs)

             Effectiveness · Equity`,strengths:[`Applicable to complex, multi-objective programmes where RCTs are not feasible`,`Integrates theory of change with economic valuation — keeps the two linked`,`Allows partial monetisation (monetise what you can; narrate the rest)`,`'What if' scenario questions handle irreducible uncertainty without abandoning the exercise`],limitations:[`Three hard problems: (1) benefits with long lags not yet observable; (2) intangible benefits hard to measure let alone value; (3) theory-based approaches cannot precisely quantify additionality`,`Double counting is the biggest risk — multiple benefit pathways may overlap; use theory of change to identify genuinely distinct pathways`,`Lack of formal guidance: the Magenta Book refers back to Green Book appraisal guidance, which was not designed for ex post evaluation`,`Speculative monetisation of uncertain benefits can undermine credibility more than admitting limits`],example:`Innovation fund evaluation (adapted from Frontier's Innovate UK / Catapult work): the theory of change identifies three distinct benefit pathways — jobs created at higher productivity than counterfactual, IP and licensing revenues generated, and spillover knowledge adoption by other firms. Only the first two can be credibly monetised. Jobs are valued using wage premium above counterfactual (not gross wages — Green Book requires net additionality). IP revenues are discounted to present value. Wider spillovers are described narratively. A 'what if' question asks: how large would spillovers need to be for BCR to remain above 1 even if job creation estimates are halved? Answer: spillovers need to represent only 15% of expected knowledge diffusion — a plausible lower bound given the evidence. Conclusion: VfM is robust.`}],te=[{term:`QALY (Quality-Adjusted Life Year)`,def:`One year of life in perfect health (utility = 1.0). One year in a health state with utility 0.6 = 0.6 QALYs. Calculated as the area under the utility-over-time curve. Integrates both length and quality of life into a single metric, enabling cross-disease comparisons.`,formula:`QALY = utility × time
Area under utility–time curve`,note:`The QALY is simultaneously the most useful and most contested concept in health economics. It implies that a year of life in severe disability is worth less than a healthy year — which many ethicists, disability advocates, and clinicians find unacceptable. It also weights identical QALYs equally regardless of who receives them, ignoring distributional concerns. NICE's end-of-life premium and severity weighting are partial responses to these concerns.`},{term:`ICER (Incremental Cost-Effectiveness Ratio)`,def:`The additional cost of gaining one additional unit of health benefit (QALY, life year, or clinical outcome) by switching from the comparator to the new treatment. The central result of most economic evaluations.`,formula:`ICER = (Cost_new − Cost_comparator) / (Effect_new − Effect_comparator)
= ΔCost / ΔEffect`,note:`The ICER has no meaning in isolation — it must be compared to the decision-maker's WTP threshold (lambda). An ICER of £50,000/QALY is unacceptable to NICE (threshold ~£30,000) but may be acceptable in a country with higher per-capita income or different priorities. ICERs are context-specific: the same drug can be cost-effective in one country and not in another.`},{term:`WTP Threshold (Lambda)`,def:`The maximum cost per QALY (or other outcome unit) that a payer or health system is willing to accept. A new treatment with ICER below lambda is cost-effective; above lambda, it is not. The threshold is the implicit or explicit monetary value placed on one QALY.`,formula:`Decision rule: accept if ICER ≤ λ
UK NICE: λ ≈ £20,000–£30,000/QALY
Australia: ~AUD 42,000–76,000/QALY`,note:`Lambda is politically determined, not economically derived. The WHO 1–3× GDP per capita per DALY threshold is a rough heuristic for LMICs. In India, 1× GDP per capita per QALY ≈ INR 1.7 lakh (~USD 2,000) in 2023 terms. Using this threshold, most expensive biologics and new cancer drugs are not cost-effective — which has significant implications for PMJAY benefit package design.`},{term:`Utility (Health State Value)`,def:`A preference weight for a health state on a 0 (dead) to 1 (full health) scale. Negative values are possible for states worse than death. Utilities are multiplied by time to calculate QALYs. The same disease produces different utilities across measurement methods and populations.`,formula:`Methods: Standard Gamble, Time Trade-Off, VAS, EQ-5D tariff
Typically: SG > TTO > VAS in ordering`,note:`The choice of utility measurement method materially affects QALYs and therefore ICERs. NICE requires EQ-5D (UK tariff) as the primary utility source. Using patient-reported EQ-5D scores vs clinician-assessed utilities vs SG-elicited utilities can produce ICER differences of 20–50%. This methodological dependence is a source of strategic behaviour by industry in HTA submissions.`},{term:`Discounting`,def:`Reducing future costs and health benefits to their present value using a discount rate. Reflects time preference (preference for benefits now over later) and opportunity cost of capital. PV = FV / (1+r)^t. UK NICE uses 3.5%/year for both costs and effects.`,formula:`PV = FV / (1 + r)^t
where r = discount rate, t = years in future
UK: 3.5%/year (costs and effects)
WHO: 3%/year (effects)`,note:`Discounting health effects is ethically contested — it implies that a QALY gained in 20 years is worth less than a QALY gained today, which some argue is unjust to future patients. At 3.5% discount rate, a QALY in 20 years is worth only 50% of one today. This significantly disadvantages preventive interventions and vaccines, whose benefits accrue over decades.`},{term:`EQ-5D`,def:`The most widely used generic preference-based measure for utility calculation. Five dimensions: mobility, self-care, usual activities, pain/discomfort, anxiety/depression. Each has 3 levels (EQ-5D-3L: 243 health states) or 5 levels (EQ-5D-5L: 3,125 states). Health state profiles are converted to utility indices using population-derived tariffs.`,formula:`Profile → utility index via population tariff
Examples: UK tariff (Dolan 1997)
India tariff: under development`,note:`EQ-5D tariffs are derived from general population preferences in a specific country — the UK tariff is derived from 3,000 UK residents. Applying UK tariffs to Indian patients involves a systematic mismatch: different cultural attitudes to health states, different disease profiles, different baseline health expectations. HTAIn acknowledges this and is working on an India-specific EQ-5D tariff, but it is not yet available for routine use.`},{term:`Markov Model`,def:`A mathematical model for chronic disease in which patients move between defined mutually exclusive health states (e.g. mild, moderate, severe, dead) in discrete time cycles. Transition probabilities determine movement. Each state has a cost and utility. Cumulative costs and QALYs are calculated over the model's time horizon.`,formula:`States: S₁, S₂, ..., Sₙ (including death)
Transition matrix P: P(i→j) per cycle
Cost_total = Σₜ Σᵢ n_it × cost_i / (1+r)^t
QALY_total = Σₜ Σᵢ n_it × u_i × Δt / (1+r)^t`,note:`The Markovian assumption (memory-less: future transitions depend only on current state) is a simplification. A patient who has just had a relapse has different transition probabilities than a patient who has been stable for 5 years — but a simple Markov model treats them identically. Tunnel states (temporary states that track recent history) can partially address this. Microsimulation models that track individual patient histories avoid the assumption entirely but are computationally expensive.`},{term:`Cost-Effectiveness Acceptability Curve (CEAC)`,def:`A curve showing the probability that a treatment is cost-effective across a range of WTP thresholds. Derived from probabilistic sensitivity analysis (PSA). At any given threshold lambda, the CEAC shows what proportion of Monte Carlo simulation iterations produced an ICER below that threshold.`,formula:`CEAC(λ) = P(ICER ≤ λ) = P(Net Monetary Benefit ≥ 0)
= P(ΔEffect × λ − ΔCost ≥ 0)
NMB = ΔEffect × λ − ΔCost`,note:`CEACs communicate uncertainty in a decision-relevant way. If a treatment has a 45% probability of being cost-effective at £30,000/QALY, the decision is genuinely uncertain — not a matter of the model being imprecise but of the inherent uncertainty in the evidence. This framing allows decision-makers to understand what probability of cost-effectiveness they are willing to accept, and whether additional research (value of information) would materially change the decision.`}],ne=[{title:`HTAIn: India's Health Technology Assessment Programme`,body:`India established HTAIn (Health Technology Assessment in India) under the Department of Health Research, Ministry of Health, in 2017. It is housed within the Indian Council of Medical Research (ICMR) and operates a secretariat that commissions and reviews health technology assessments. India is one of the few lower-middle-income countries with a formal institutional HTA infrastructure. HTAIn's guidelines (2018, updated 2020) follow the standard methodological framework in Kobelt's book — incremental analysis, societal perspective, discounting at 3%/year, and preference for CUA. The programme covers drugs, devices, diagnostics, surgical procedures, and public health interventions — a broader scope than most high-income country HTA bodies, which typically focus on pharmaceuticals.`,tags:[`HTAIn`,`India`,`ICMR`,`HTA`,`Policy`]},{title:`PMJAY and the Economics of Universal Health Coverage`,body:`Pradhan Mantri Jan Arogya Yojana (PMJAY), launched in 2018, provides health insurance coverage of INR 5 lakh per family per year to approximately 500 million people — the world's largest publicly funded health assurance scheme. PMJAY's benefit package covers 1,949 procedures across 27 specialties. Economic evaluation of PMJAY packages is directly relevant to Kobelt's framework: what is the cost per QALY or cost per DALY of including a new procedure in the benefit package? What is the incremental value of a new drug or device compared to existing treatments covered? The NHA (National Health Authority) is developing methods for assessing cost-effectiveness of benefit package inclusions, creating direct demand for the analytical skills this book describes. The challenge is that PMJAY claims data — which should provide the cost and utilisation data for economic evaluation — is fragmented across state trust agencies and private insurers.`,tags:[`PMJAY`,`NHA`,`Benefit Package`,`Universal Health Coverage`,`India`]},{title:`Drug Pricing, NPPA, and Implicit Cost-Effectiveness`,body:`India's National Pharmaceutical Pricing Authority (NPPA) regulates prices of essential medicines under the Drug Price Control Order (DPCO). Price negotiations for high-cost drugs (cancer therapies, biologics) occur through a combination of NPPA regulation and procurement negotiations. These processes implicitly involve cost-effectiveness judgements — how much premium above standard care is justified for a new oncology drug? — but rarely use the explicit ICER framework Kobelt describes. The HTA evidence base for many high-cost drugs is derived from trials conducted in European and American populations, with utility data from UK or Canadian tariffs, and costs from those health systems. Applying these results to Indian decision-making requires: local cost data, India-specific utility values, local transition probabilities from observational data, and an India-appropriate WTP threshold — exactly the adaptation framework HTAIn is building.`,tags:[`NPPA`,`Drug Pricing`,`DPCO`,`Biologics`,`Cost-Effectiveness`]},{title:`Utility Measurement in India: EQ-5D and the Tariff Problem`,body:`EQ-5D is the MAUI most widely used in HTA submissions globally, and HTAIn recommends it for Indian evaluations. The problem is that no India-specific EQ-5D population tariff exists yet — evaluations must use UK, Chinese, or other available tariffs, which represent different populations' preferences for health states. Research at AIIMS and other Indian institutions has documented that Indian patients rate health states differently from European populations, particularly on dimensions of mobility and usual activities, reflecting different disease patterns, occupational profiles, and cultural attitudes to health. The EQ-5D-5L Hindi and regional language versions have been validated for use in India. An India-specific value set is in development but not yet published. Until it is available, utility values in Indian HTAs carry a systematic source of uncertainty that sensitivity analysis should explicitly address.`,tags:[`EQ-5D`,`Utility Measurement`,`AIIMS`,`India Tariff`,`QALYs`]},{title:`DALYs, QALYs, and India's Threshold Debate`,body:`India's disease burden literature (ICMR, GBD India) predominantly uses DALYs (disability-adjusted life years) rather than QALYs — DALYs are additive from a burden-of-disease perspective and calculated using disability weights from population studies, while QALYs are derived from preference elicitation and used for economic evaluation. HTAIn uses both, with cost per QALY as the primary metric for HTA submissions. The informal cost-effectiveness threshold discussed in Indian health economics literature is INR 1–3 lakh per QALY, corresponding roughly to 1–3× GDP per capita following the WHO CMH recommendation. At 2023 per capita GDP (approximately INR 1.7 lakh), this implies a threshold of INR 1.7–5.1 lakh/QALY (~USD 2,000–6,000). At this threshold, most branded biologics, novel oncologics, and high-cost rare disease treatments are not cost-effective — a conclusion with profound implications for PMJAY benefit package design and drug reimbursement policy.`,tags:[`DALY`,`QALY`,`Threshold`,`WHO`,`India`,`GDP`]},{title:`Real-World Evidence and HTA in the Indian Context`,body:`Kobelt's book notes that economic evaluation increasingly uses real-world evidence alongside trial data — particularly for modelling long-term outcomes. In India, systematic real-world data infrastructure is limited: electronic medical records are not standardised, claims data from government insurance schemes (PMJAY, CGHS, ESIS) is fragmented, and disease registries are few. This creates a specific Indian challenge: transition probabilities for Markov models must often be estimated from small retrospective studies or adapted from international data with uncertain generalisability. The Ayushman Bharat Digital Mission (ABDM) — creating unique health IDs and federated health data — offers the long-term prospect of rich real-world data for HTA. In the short term, HTAIn evaluations typically rely on systematic reviews of international evidence, supplemented by small Indian observational studies for local cost and utilisation data.`,tags:[`Real-World Evidence`,`ABDM`,`Claims Data`,`HTA`,`India`,`Digital Health`]}];function re({apiKey:e}){let[t,n]=(0,l.useState)([]),[r,i]=(0,l.useState)(``),[a,o]=(0,l.useState)(!1),s=(0,l.useRef)(null);(0,l.useEffect)(()=>{s.current?.scrollIntoView({behavior:`smooth`})},[t]);async function c(){if(!r.trim()||a)return;let s=r.trim();i(``),o(!0),n(e=>[...e,{r:`u`,t:s}]);try{let r=t.map(e=>({role:e.r===`u`?`user`:`model`,parts:[{text:e.t}]})),i=(await(await fetch(`${p}?key=${e}`,{method:`POST`,headers:{"Content-Type":`application/json`},body:JSON.stringify({system_instruction:{parts:[{text:`You are an expert guide to "Health Economics: An Introduction to Economic Evaluation" by Gisela Kobelt (OHE, 3rd edition, 2013). Answer questions with technical precision about health economic evaluation methods. Full book content:\n\n${m}\n\nSpeak to a PhD development economist and qualified lawyer with expertise in health policy. Explain methods clearly with formulas where relevant. Connect to HTA practice and South Asian health economics where appropriate. Be analytically rigorous and specific.`}]},contents:[...r,{role:`user`,parts:[{text:s}]}]})})).json()).candidates?.[0]?.content?.parts?.[0]?.text||`No response.`;n(e=>[...e,{r:`m`,t:i}])
